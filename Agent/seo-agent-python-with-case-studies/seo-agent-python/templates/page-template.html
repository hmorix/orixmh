<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{SEO_TITLE}}</title>
<meta name="description" content="{{META_DESCRIPTION}}" />
<link rel="canonical" href="{{CANONICAL_URL}}" />

<!-- Open Graph -->
<meta property="og:type" content="{{OG_TYPE}}" />
<meta property="og:title" content="{{OG_TITLE}}" />
<meta property="og:description" content="{{OG_DESCRIPTION}}" />
<meta property="og:url" content="{{CANONICAL_URL}}" />

<!-- Twitter -->
<meta name="twitter:card" content="{{TWITTER_CARD}}" />
<meta name="twitter:title" content="{{TWITTER_TITLE}}" />
<meta name="twitter:description" content="{{TWITTER_DESCRIPTION}}" />

<!-- Schema.org JSON-LD, generated by agent/schema_generator.py -->
<script type="application/ld+json">
{{SCHEMA_JSONLD}}
</script>

<!--
  THEME CONFIG — this is the one place to edit if these don't match your
  actual site's tailwind.config.js. I only had BlogPost.tsx to go on, which
  references "obsidian", "obsidian-2", "obsidian-3", "cream", and
  "glass-border" as pre-defined Tailwind theme colors without saying what
  hex values they are — these are reasonable placeholder guesses. Swap them
  for your real values and every use across the page updates at once.
-->
<style>
  :root {
    --obsidian: #0a0a0b;      /* page background */
    --obsidian-2: #131316;    /* code block background */
    --obsidian-3: #1c1c20;    /* avatar circle background */
    --cream: 245, 240, 232;   /* body text color, as r,g,b for opacity use */
    --accent: #C8FF00;        /* lime accent used for links/highlights */
    --glass-border: rgba(255,255,255,0.08);
    --font-display: 'Space Grotesk', 'Inter', system-ui, sans-serif; /* guess — swap for your real display font */
    --font-body: 'Inter', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--obsidian);
    color: rgb(var(--cream));
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { padding: 8rem 0 5rem; min-height: 100vh; }
  .container { max-width: 800px; margin: 0 auto; padding: 0 2rem; }
  a { color: inherit; text-decoration: none; }
  .back-link {
    display: inline-flex; align-items: center; gap: 0.5rem;
    font-size: 0.875rem; color: rgba(var(--cream), 0.4);
    margin-bottom: 2rem; transition: color 0.15s;
  }
  .back-link:hover { color: var(--accent); }
  .category-badge {
    display: inline-block; padding: 0.125rem 0.5rem;
    background: rgba(200,255,0,0.1); color: var(--accent);
    font-family: var(--font-mono); font-size: 0.75rem; border-radius: 4px;
    margin-bottom: 1rem;
  }
  h1.title {
    font-family: var(--font-display); font-weight: 700;
    font-size: 2rem; line-height: 1.25; margin: 0 0 1.5rem;
  }
  @media (min-width: 768px) { h1.title { font-size: 2.5rem; } }
  .meta-row {
    display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap;
    margin-bottom: 2rem; padding-bottom: 2rem; border-bottom: 1px solid var(--glass-border);
  }
  .author-block { display: flex; align-items: center; gap: 0.75rem; }
  .avatar {
    width: 2.5rem; height: 2.5rem; border-radius: 9999px;
    background: var(--obsidian-3); display: flex; align-items: center;
    justify-content: center; font-size: 0.75rem; font-weight: 700;
  }
  .author-name { font-size: 0.875rem; font-weight: 500; }
  .author-role { font-size: 0.75rem; color: rgba(var(--cream), 0.3); }
  .meta-item { display: flex; align-items: center; gap: 0.25rem; font-size: 0.75rem; color: rgba(var(--cream), 0.3); }
  .meta-actions { margin-left: auto; display: flex; align-items: center; gap: 0.5rem; }
  .icon-btn {
    width: 2rem; height: 2rem; border: 1px solid var(--glass-border); border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    color: rgba(var(--cream), 0.4); background: transparent; cursor: pointer;
    transition: all 0.15s;
  }
  .icon-btn:hover { color: var(--accent); border-color: var(--accent); }
  article.content p {
    color: rgba(var(--cream), 0.6); line-height: 1.75; margin: 0 0 1rem;
    white-space: pre-line;
  }
  article.content h2 {
    font-family: var(--font-display); font-weight: 700; font-size: 1.25rem;
    margin: 2.5rem 0 1rem;
  }
  article.content pre {
    background: var(--obsidian-2); border: 1px solid var(--glass-border);
    border-radius: 8px; padding: 1rem; overflow-x: auto; margin: 1.5rem 0;
  }
  article.content code {
    font-family: var(--font-mono); font-size: 0.75rem; color: rgba(var(--cream), 0.7);
    white-space: pre;
  }
  .engagement {
    margin-top: 3rem; padding-top: 2rem; border-top: 1px solid var(--glass-border);
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem;
  }
  .helpful-btn {
    display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 1rem;
    background: rgba(255,255,255,0.04); border: 1px solid var(--glass-border);
    border-radius: 8px; font-size: 0.875rem; color: rgba(var(--cream), 0.5);
    cursor: pointer; transition: all 0.15s;
  }
  .helpful-btn:hover { color: var(--accent); border-color: var(--accent); }
  .helpful-btn.active { color: var(--accent); border-color: var(--accent); }
  .share-row { display: flex; align-items: center; gap: 0.5rem; font-size: 0.75rem; color: rgba(var(--cream), 0.3); }
  .share-row button {
    padding: 0.25rem 0.5rem; background: rgba(255,255,255,0.04); border: none;
    border-radius: 4px; color: inherit; cursor: pointer; font-size: 0.75rem;
  }
  .share-row button:hover { color: rgb(var(--cream)); }
</style>
</head>
<body>
<div class="wrap">
  <div class="container">
    <a href="{{BLOG_INDEX_URL}}" class="back-link">
      <i data-lucide="arrow-left" style="width:14px;height:14px;"></i> Back to Blog
    </a>

    <span class="category-badge">{{CATEGORY}}</span>
    <h1 class="title">{{TITLE}}</h1>

    <div class="meta-row">
      <div class="author-block">
        <div class="avatar">{{AUTHOR_INITIALS}}</div>
        <div>
          <div class="author-name">{{AUTHOR}}</div>
          <div class="author-role">{{AUTHOR_ROLE}}</div>
        </div>
      </div>
      <span class="meta-item"><i data-lucide="clock" style="width:12px;height:12px;"></i>{{READ_TIME}}</span>
      <span class="meta-item">{{DATE}}</span>
      <div class="meta-actions">
        <button class="icon-btn" onclick="sharePage()" aria-label="Share">
          <i data-lucide="share-2" style="width:14px;height:14px;"></i>
        </button>
        <button class="icon-btn" id="bookmarkBtn" onclick="toggleBookmark()" aria-label="Bookmark">
          <i data-lucide="bookmark" style="width:14px;height:14px;"></i>
        </button>
      </div>
    </div>

    <article class="content">
      {{ARTICLE_CONTENT}}
    </article>

    <div class="engagement">
      <button class="helpful-btn" id="helpfulBtn" onclick="toggleHelpful()">
        <i data-lucide="thumbs-up" style="width:14px;height:14px;"></i> <span id="helpfulLabel">Helpful</span>
      </button>
      <div class="share-row">
        <span>Share:</span>
        <button onclick="shareTo('twitter')">Twitter</button>
        <button onclick="shareTo('linkedin')">LinkedIn</button>
        <button onclick="copyLink()">Copy Link</button>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script>
  lucide.createIcons();

  const PAGE_URL = "{{CANONICAL_URL}}";
  const PAGE_TITLE = {{TITLE_JSON}};

  function sharePage() {
    if (navigator.share) {
      navigator.share({ title: PAGE_TITLE, url: PAGE_URL }).catch(() => {});
    } else {
      copyLink();
    }
  }

  function shareTo(network) {
    const url = encodeURIComponent(PAGE_URL);
    const text = encodeURIComponent(PAGE_TITLE);
    const links = {
      twitter: `https://twitter.com/intent/tweet?url=${url}&text=${text}`,
      linkedin: `https://www.linkedin.com/sharing/share-offsite/?url=${url}`,
    };
    window.open(links[network], "_blank", "noopener,noreferrer");
  }

  function copyLink() {
    navigator.clipboard.writeText(PAGE_URL).catch(() => {});
  }

  function toggleBookmark() {
    const btn = document.getElementById("bookmarkBtn");
    const key = "bookmarked:" + "{{SLUG}}";
    const isBookmarked = localStorage.getItem(key) === "1";
    if (isBookmarked) { localStorage.removeItem(key); btn.classList.remove("active"); }
    else { localStorage.setItem(key, "1"); btn.classList.add("active"); }
  }

  function toggleHelpful() {
    const btn = document.getElementById("helpfulBtn");
    const key = "helpful:" + "{{SLUG}}";
    const isSet = localStorage.getItem(key) === "1";
    if (isSet) { localStorage.removeItem(key); btn.classList.remove("active"); }
    else { localStorage.setItem(key, "1"); btn.classList.add("active"); }
  }

  (function initToggles() {
    if (localStorage.getItem("bookmarked:" + "{{SLUG}}") === "1") document.getElementById("bookmarkBtn").classList.add("active");
    if (localStorage.getItem("helpful:" + "{{SLUG}}") === "1") document.getElementById("helpfulBtn").classList.add("active");
  })();
</script>
</body>
</html>
